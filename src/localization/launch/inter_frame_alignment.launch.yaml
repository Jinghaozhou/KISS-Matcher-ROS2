---
launch:
  - arg: {name: start_rviz, default: "true"}
  - arg: {name: namespace, default: "inter_frame"}
  - arg: {name: rviz_path, default: $(find-pkg-share kiss_matcher_localization)/rviz/kimera_multi_initial_alignment.rviz}
  - arg: {name: config_path, default: $(find-pkg-share kiss_matcher_localization)/config/alignment_config.yaml}
  - arg: {name: source_topic, default: "/source_cloud"}
  - arg: {name: target_topic, default: "/target_cloud"}
  - arg: {name: source_frame, default: "source_map"}
  - arg: {name: target_frame, default: "target_map"}
  - arg: {name: frame_update_hz, default: "0.1"}

  - node:
      namespace: $(var namespace)
      pkg: kiss_matcher_localization
      exec: inter_frame_alignment
      name: inter_frame_aligner
      output: screen
      on_exit: shutdown
      remap:
        - {from: source, to: $(var source_topic)}
        - {from: target, to: $(var target_topic)}
      param:
        - {name: source_frame, value: $(var source_frame)}
        - {name: target_frame, value: $(var target_frame)}
        - {name: frame_update_hz, value: $(var frame_update_hz)}
        - from: $(var config_path)

  - node:
      if: $(var start_rviz)
      pkg: rviz2
      exec: rviz2
      name: inter_frame_rviz
      launch-prefix: nice
      output: screen
      args: >
        -d $(var rviz_path)
